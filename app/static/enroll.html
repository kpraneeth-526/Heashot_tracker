<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register for Headshots</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e11d48' stroke-width='2'%3E%3Cpath d='M4 8h3l2-3h6l2 3h3v11H4z'/%3E%3Ccircle cx='12' cy='13' r='3.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/booth.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Headshot Booth
    </a>
    <nav class="nav">
      <a href="/enroll" aria-current="page">Register</a>
      <a href="/">Booth</a>
    </nav>
  </header>

  <main class="enroll">
    <div class="intro">
      <h1>Register for headshots</h1>
      <p class="lede">Add your details and a reference photo so the booth can recognize you.</p>
    </div>

    <div class="layout">
      <div class="card form-card">
        <label class="field">
          <span>Full name</span>
          <input id="name" type="text" placeholder="Jane Doe" autocomplete="off">
        </label>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="off">
        </label>
        <label class="field">
          <span>UGA ID <em>optional</em></span>
          <input id="uga-id" type="text" inputmode="numeric" placeholder="811 123 4567" autocomplete="off">
        </label>
        <label class="consent">
          <input id="save" type="checkbox">
          <span>Save my photo on this computer so I'm still registered next time (demo only;
            ask the booth owner to delete it any time)</span>
        </label>
        <p class="note">Testing only. Unless you tick the box above, your photo is not saved:
          the face data is kept in memory and erased when the booth stops.</p>
      </div>

      <div class="camera-col">
        <div class="stage">
          <video id="video" autoplay playsinline muted></video>
          <canvas id="live" hidden></canvas>
          <canvas id="canvas" hidden></canvas>
          <div class="guide" aria-hidden="true"></div>
        </div>
        <div class="panel">
          <p id="status" role="status">Starting camera…</p>
          <div class="buttons">
            <button id="capture" class="primary" disabled>Take photo</button>
            <button id="upload" class="secondary" disabled>Upload photo</button>
            <input id="file" type="file" accept="image/*" hidden>
            <button id="retake" class="primary" hidden>Register another</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/static/camera.js"></script>
  <script src="/static/enroll.js"></script>
</body>
</html>
