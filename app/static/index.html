<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headshot Booth</title>
  <link rel="stylesheet" href="/static/booth.css">
</head>
<body>
  <main>
    <h1>Headshot Booth</h1>
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
    </div>
    <p id="status" role="status">Starting camera…</p>
    <div class="buttons">
      <button id="capture" disabled>Take photo <kbd>Space</kbd></button>
      <button id="retake" hidden>Retake</button>
    </div>

    <!-- After a photo: confirm the match, or find yourself on the roster. -->
    <section id="confirm" hidden>
      <div class="buttons">
        <button id="yes">Yes, that's me</button>
        <button id="not-me" class="secondary">Not me</button>
      </div>
    </section>
    <section id="lookup" hidden>
      <div class="fields">
        <input id="query" type="text" placeholder="UGA ID or name" autocomplete="off">
      </div>
      <div id="results" class="buttons"></div>
      <p><button id="no-roster" class="link">Not on the list? Enter your email</button></p>
    </section>
    <section id="manual" hidden>
      <form id="manual-form" class="fields">
        <input id="email" type="email" placeholder="Email" autocomplete="off">
        <button>Send</button>
      </form>
    </section>
  </main>
  <script src="/static/camera.js"></script>
  <script src="/static/booth.js"></script>
</body>
</html>
