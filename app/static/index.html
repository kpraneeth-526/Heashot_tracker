<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Headshot Booth</title>
  <link rel="stylesheet" href="/static/booth.css">
</head>
<body>
  <main>
    <h1>Headshot Booth</h1>
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
    </div>
    <p id="status" role="status">Starting camera…</p>
    <div class="buttons">
      <button id="capture" disabled>Take photo <kbd>Space</kbd></button>
      <button id="retake" hidden>Retake</button>
    </div>
  </main>
  <script src="/static/booth.js"></script>
</body>
</html>
